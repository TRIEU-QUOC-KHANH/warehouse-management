services:

  mysql:
    image: mysql:8.0
    container_name: warehouse-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: warehouse_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: warehouse-phpmyadmin

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8082:80"

    depends_on:
      - mysql
  nginx:
    image: nginx:alpine
    container_name: warehouse-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - mysql
volumes:
  mysql_data: